<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AWS Resource Graph</title>
  <style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #0e1117;
  color: #fff;
  font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, "Apple Color Emoji", "Segoe UI Emoji";
}

#graph {
  position: absolute;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
}

/* --- Controls --- */
#controls {
  position: fixed;
  top: 10px; right: 10px;
  background: rgba(25,25,30,0.85);
  padding: 6px 8px;
  border-radius: 8px;
  display: flex;
  gap: 6px;
  z-index: 30;
}
#controls input {
  background: #1a1d25;
  border: none;
  border-radius: 4px;
  padding: 5px 8px;
  color: #ddd;
  width: 160px;
}
#controls button {
  background: #333;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  padding: 6px 10px;
}
#controls button:hover { background: #444; }

/* --- Legend --- */
#legend {
  position: fixed;
  top: 10px; left: 10px;
  background: rgba(20,20,25,0.85);
  border-radius: 8px;
  padding: 10px;
  font-size: 12px;
  color: #ddd;
  max-height: 90vh;
  overflow-y: auto;
  z-index: 20;
}
.legend-group { margin-bottom: 6px; }
.legend-service {
  font-weight: 600;
  margin-bottom: 4px;
  cursor: pointer;
}
.legend-item {
  display: flex;
  align-items: center;
  margin-left: 8px;
  cursor: pointer;
  transition: opacity 0.2s ease, filter 0.2s ease;
  opacity: 1;
}
.legend-item:hover { opacity: 0.8; }
.legend-item.inactive { opacity: 0.35; }
.color-box {
  width: 12px;
  height: 12px;
  margin-right: 6px;
  border-radius: 3px;
}

/* --- Info panel --- */
#infoPanel {
  position: fixed;
  top: 0; right: 0;
  width: 380px;
  height: 100vh;
  background: rgba(20,22,30,0.95);
  color: #eee;
  overflow-y: auto;
  padding: 16px;
  box-shadow: -3px 0 10px rgba(0,0,0,0.4);
  transform: translateX(100%);
  transition: transform 0.28s ease;
  z-index: 25;
}
#infoPanel.visible { transform: translateX(0); }
#infoPanel h2 { font-size: 18px; margin: 0 0 12px 0; color: #fff; }
#infoPanel hr { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 10px 0; }

#closeBtn {
  position: absolute;
  top: 10px; right: 12px;
  font-size: 18px;
  cursor: pointer;
  color: #aaa;
}
#closeBtn:hover { color: #fff; }

.info-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 4px 0;
  font-size: 13px;
}
.info-row b { min-width: 96px; display: inline-block; color: #cfd8dc; }

.editable-field,
.editable-textarea {
  background: #101318;
  color: #e0e0e0;
  border: 1px solid #2b2f3a;
  border-radius: 6px;
  padding: 6px 8px;
  width: 100%;
  font-size: 13px;
}
.editable-textarea { min-height: 80px; resize: vertical; }

/* Buttons inside panel */
.panel-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.panel-actions button {
  background: #2f3948;
  border: none;
  color: #fff;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}
.panel-actions button:hover { background: #3a4658; }

/* JSON pretty */
.json-block {
  background: rgba(0,0,0,0.5);
  color: #cceeff;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 12px;
  line-height: 1.4;
  border-radius: 6px;
  padding: 8px;
  overflow-x: auto;
  white-space: pre;
}
details summary { cursor: pointer; color: #fff; margin: 6px 0; }
details summary:hover { color: #0ff; }

/* JSON syntax colors if using highlighter */
.json-key { color: #66d9ef; }
.json-string { color: #a6e22e; }
.json-number { color: #fd971f; }
.json-boolean { color: #f92672; }
.json-null { color: #75715e; }

@keyframes shake {
  0% { transform: translate(0, 0); }
  20% { transform: translate(-3px, 0); }
  40% { transform: translate(3px, 0); }
  60% { transform: translate(-3px, 0); }
  80% { transform: translate(3px, 0); }
  100% { transform: translate(0, 0); }
}
.node-shake {
  animation: shake 0.4s;
}

  </style>
  <script src="https://unpkg.com/force-graph@1.45.0/dist/force-graph.min.js"></script>
</head>

let editMode = false;
let searchTerm = "";

function hashColor(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue},70%,55%)`;
}

// Group color keys
const grouped = {};
Object.keys(colorMap).forEach(k => {
  const idx = k.indexOf(":");
  const svc = idx === -1 ? k : k.slice(0, idx);
  const subtype = idx === -1 ? "default" : k.slice(idx + 1);
  if (!grouped[svc]) grouped[svc] = {};
  grouped[svc][subtype || "default"] = colorMap[k];
});

let activeKeys = new Set(Object.keys(colorMap));

function getConnectedNodes(nodeId, direction = "out") {
  const gData = Graph.graphData();
  const out = new Set();
  if (direction === "out" || direction === "both") {
    gData.links.forEach(l => {
      if (l.source.id === nodeId || l.source === nodeId) out.add(l.target.id || l.target);
    });
  }
  if (direction === "in" || direction === "both") {
    gData.links.forEach(l => {
      if (l.target.id === nodeId || l.target === nodeId) out.add(l.source.id || l.source);
    });
  }
  return Array.from(out);
}

function markDownstreamParameters(nodeId, newState, visited = new Set()) {
  if (visited.has(nodeId)) return;
  visited.add(nodeId);

  const gData = Graph.graphData();
  const node = gData.nodes.find(n => n.id === nodeId);
  if (!node) return;

  // --- Lock check ---------------------------------------------------
  const locked =
    node.metadata?.implicit_aws_managed ||
    node.metadata?.immutable_reference ||
    node.service === "bedrock";
  if (locked) return; // stop propagation at locked nodes
  // -----------------------------------------------------------------

  node.is_parameter = newState;
  node.metadata = node.metadata || {};
  node.metadata.Parameter = newState;

  const downstream = getConnectedNodes(nodeId, "out");
  downstream.forEach(childId => markDownstreamParameters(childId, newState, visited));
}

function createLegend() {
  legendDiv.innerHTML = "";
  Object.entries(grouped).forEach(([svc, subs]) => {
    const keys = Object.keys(subs);
    const groupDiv = document.createElement("div");
    groupDiv.className = "legend-group";

    const title = document.createElement("div");
    title.className = "legend-service";
    title.textContent = svc;
    title.onclick = () => toggleGroup(svc);
    groupDiv.appendChild(title);

    const showAll = keys.length > 1;
    keys.forEach(sub => {
      if (sub === "default" && !showAll) return;
      const key = sub === "default" ? svc : `${svc}:${sub}`;
      const color = subs[sub];
      const colorBox =
        sub === "default"
          ? `<div class='color-box' style='background:none;border:1px solid #999'></div>`
          : `<div class='color-box' style='background:${color}'></div>`;
      const label = sub === "default" ? "(all)" : sub;
      const item = document.createElement("div");
      item.className = "legend-item";
      item.dataset.key = key;
      item.innerHTML = `${colorBox}${label}`;
      item.onclick = () => toggleGroup(key);
      groupDiv.appendChild(item);
    });

    legendDiv.appendChild(groupDiv);
  });
  updateLegendStyles();
}

function rebuildLegendFromGraph() {
  const gData = Graph.graphData();
  const seen = new Set();
  const newColors = { ...colorMap };

  gData.nodes.forEach(n => {
    n.subtype = (n.subtype || "").toLowerCase();
    n.service = (n.service || "unknown").toLowerCase();
    n.color_key = n.subtype ? `${n.service}:${n.subtype}` : n.service;
    seen.add(n.color_key);
    if (!newColors[n.color_key]) newColors[n.color_key] = hashColor(n.color_key);
  });

  Object.assign(colorMap, newColors);
  activeKeys = new Set(Object.keys(colorMap));
  Object.keys(grouped).forEach(k => delete grouped[k]);
  Object.keys(colorMap).forEach(k => {
    const idx = k.indexOf(":");
    const svc = idx === -1 ? k : k.slice(0, idx);
    const sub = idx === -1 ? "default" : k.slice(idx + 1);
    if (!grouped[svc]) grouped[svc] = {};
    grouped[svc][sub] = colorMap[k];
  });

  createLegend();
}

function toggleGroup(key) {
  const affected = Object.keys(colorMap).filter(k => k === key || k.startsWith(`${key}:`));
  const active = affected.some(k => activeKeys.has(k));
  if (active) affected.forEach(k => activeKeys.delete(k));
  else affected.forEach(k => activeKeys.add(k));
  updateLegendStyles();
  Graph.graphData(Graph.graphData());
}

function updateLegendStyles() {
  document.querySelectorAll(".legend-item").forEach(el => {
    const key = el.dataset.key;
    const on = activeKeys.has(key);
    el.classList.toggle("inactive", !on);
    const box = el.querySelector(".color-box");
    if (box) box.style.filter = on ? "brightness(1)" : "brightness(0.55)";
  });
}
createLegend();

// -------------------------------------------
// Graph Setup
// -------------------------------------------
const fg = document.getElementById("graph");
const Graph = ForceGraph()(fg)
  .graphData(data)
  .nodeId("id")
  .nodeLabel(n => `${n.id}\n(${n.service}${n.subtype ? ":" + n.subtype : ""})`)
  .nodeColor(n => colorMap[n.color_key] || "#777")
  .linkColor(link => link.inferred ? "#999999" : "#aaaaaa")
  .linkWidth(link => link.inferred ? 1.5 : 2.0)
  .linkDirectionalParticles(link => link.inferred ? 0 : 2)
  .linkCurvature(link => link.inferred ? 0.2 : 0)
  .linkCanvasObjectMode(() => 'after')
  .linkCanvasObject((link, ctx, globalScale) => {
    if (link.inferred) {
      const start = link.source;
      const end = link.target;
      if (typeof start !== "object" || typeof end !== "object") return;
      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = "#999999";
      ctx.beginPath();
      ctx.moveTo(start.x, start.y);
      ctx.lineTo(end.x, end.y);
      ctx.stroke();
      ctx.restore();
    }
  })
  .backgroundColor("#0e1117")
  .onNodeClick(n => {
    Graph.centerAt(n.x, n.y, 800);
    Graph.zoom(4, 800);
    showNodeInfo(n);
  }).onNodeRightClick(n => {
    // Detect locked nodes
    const locked = n.metadata?.implicit_aws_managed || n.metadata?.immutable_reference || n.service === "bedrock";
    if (locked) {
      // UX feedback: small shake or flash
      const canvas = document.getElementById("graph");
      canvas.classList.add("node-shake");
      setTimeout(() => canvas.classList.remove("node-shake"), 400);
      return; // skip toggling
    }

    const newState = !n.is_parameter;
    markDownstreamParameters(n.id, newState);
    Graph.graphData(Graph.graphData());
  })
  .nodeVisibility(n => !searchTerm || n.id.toLowerCase().includes(searchTerm))
  .nodeCanvasObject((n, ctx, scale) => {
    const r = 6;
    const active = activeKeys.has(n.color_key);
    const color = colorMap[n.color_key] || "#777";
    const err = n.is_error || n.metadata?.Unresolved || n.metadata?.Error;
    const seed = n.is_seed || n.metadata?.Seed;
    const param = n.is_parameter || n.metadata?.Parameter;
    const implicit = n.metadata?.implicit_aws_managed;
    const locked = implicit || n.metadata?.immutable_reference || n.service === "bedrock";

    if (locked) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r + 2, 0, 2 * Math.PI);
      ctx.strokeStyle = "#00ffff"; // cyan glow for locked
      ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.7;
    }


    // Draw parameter as diamond
    if (param) {
      ctx.beginPath();
      ctx.moveTo(n.x, n.y - r);
      ctx.lineTo(n.x + r, n.y);
      ctx.lineTo(n.x, n.y + r);
      ctx.lineTo(n.x - r, n.y);
      ctx.closePath();
      ctx.fillStyle = active ? color : "rgba(150,150,150,0.25)";
      ctx.fill();
      ctx.strokeStyle = "#ffffff55";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else {
      // normal circle
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
      ctx.fillStyle = active ? color : "rgba(150,150,150,0.25)";
      ctx.fill();
    }

    if (err) {
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = "#ff3333";
      ctx.stroke();
    } else if (seed) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = "#f1ff33ff";
      ctx.stroke();
    }

    const fs = 10 / scale;
    ctx.font = `${fs}px Sans-Serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillStyle = active ? "#fff" : "rgba(255,255,255,0.35)";
    ctx.fillText(n.id, n.x, n.y + 6);
    ctx.globalAlpha = 1.0;
  });

// -------------------------------------------
// Info Panel
// -------------------------------------------
let currentNode = null;
function showNodeInfo(node) {
  currentNode = node;
  infoPanel.classList.add("visible");
  nodeTitle.textContent = node.id;
  nodeDetails.innerHTML = "";

  const meta = [
    ["Service", node.service],
    ["Subtype", node.subtype],
    ["CFN Type", node.cfn_type],
    ["Error", node.error_msg || ""],
  ];
  meta.forEach(([k, v]) => {
    const row = document.createElement("div");
    row.className = "info-row";
    row.innerHTML = `<b>${k}:</b> <div>${v ?? ""}</div>`;
    nodeDetails.appendChild(row);
  });

  if (node.properties && Object.keys(node.properties).length) {
    nodeDetails.appendChild(document.createElement("hr"));
    const pTitle = document.createElement("div");
    pTitle.innerHTML = "<b>Properties</b>";
    nodeDetails.appendChild(pTitle);
    for (const [k, v] of Object.entries(node.properties)) {
      const row = document.createElement("div");
      row.className = "info-row";
      const pre = document.createElement("pre");
      pre.className = "json-block";
      pre.textContent = typeof v === "object" ? JSON.stringify(v, null, 2) : v;
      row.innerHTML = `<b>${k}:</b>`;
      row.appendChild(pre);
      nodeDetails.appendChild(row);
    }
  }

  if (node.arns && Object.keys(node.arns).length) {
    nodeDetails.appendChild(document.createElement("hr"));
    const aTitle = document.createElement("div");
    aTitle.innerHTML = "<b>ARNs</b>";
    nodeDetails.appendChild(aTitle);
    const list = document.createElement("ul");
    for (const [k, v] of Object.entries(node.arns)) {
      const li = document.createElement("li");
      li.innerHTML = `${k}: <code>${v}</code>`;
      list.appendChild(li);
    }
    nodeDetails.appendChild(list);
  }

  nodeDetails.appendChild(document.createElement("hr"));
  const det = document.createElement("details");
  det.open = false;
  det.innerHTML = `<summary><b>Raw Node Data</b></summary>
  <pre class='json-block'>${JSON.stringify(node, null, 2)}</pre>`;
  nodeDetails.appendChild(det);
}
closeBtn.onclick = () => infoPanel.classList.remove("visible");

// -------------------------------------------
// Controls
// -------------------------------------------
resetBtn.onclick = () => {
  searchTerm = "";
  searchBox.value = "";
  activeKeys = new Set(Object.keys(colorMap));
  updateLegendStyles();
  Graph.graphData(Graph.graphData());
};
searchBox.oninput = () => {
  searchTerm = searchBox.value.trim().toLowerCase();
  Graph.graphData(Graph.graphData());
};
exportBtn.onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "graph-edited.json";
  a.click();
  URL.revokeObjectURL(url);
};
editToggleBtn.onclick = () => {
  editMode = !editMode;
  editToggleBtn.textContent = `Edit: ${editMode ? "On" : "Off"}`;
  document.body.classList.toggle("edit-mode", editMode);
};

// -------------------------------------------
// Initialize
// -------------------------------------------
rebuildLegendFromGraph();
updateLegendStyles();

  </script>
</body>
