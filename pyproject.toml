[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-sync-tool"
version = "0.8.0"
description = "AWS resource sync and dependency graph generator for multi-account CDK/CloudFormation deployment."
authors = [
    { name = "Carter", email = "you@example.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "boto3>=1.26",
    "botocore[crt]>=1.29",
    "networkx>=3.1",
    "argcomplete>=3.1",
    "jinja2>=3.1",
    "typing-extensions>=4.7",
]
[project.scripts]
aws-graph = "cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[tool.setuptools]
packages = ["cli", "builder", "deploy", "graph", "utils", "planner", "resolvers"]
include-package-data = true

[tool.setuptools.package-data]
# include CDK templates and other static files
builder = ["cdk/templates/*.tpl"]
